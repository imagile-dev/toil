        - name
        - description
        - permission
        - html_url
        - repositories_url
        - slug
        - parent
        - type
    team-simple:
      title: Team Simple
      description: Groups of organization members that gives permissions on specified repositories.
      type: object
      properties:
        id:
          description: Unique identifier of the team
          type: integer
        node_id:
          type: string
        url:
          description: URL for the team
          type: string
          format: uri
        members_url:
          type: string
        name:
          description: Name of the team
          type: string
        description:
          description: Description of the team
          type:
            - string
            - 'null'
        permission:
          description: Permission that the team will have for its repositories
          type: string
        privacy:
          description: The level of privacy this team should have
          type: string
        notification_setting:
          description: The notification setting the team has set
          type: string
        html_url:
          type: string
          format: uri
        repositories_url:
          type: string
          format: uri
        slug:
          type: string
        ldap_dn:
          description: Distinguished Name (DN) that team maps to within LDAP environment
          type: string
        type:
          description: The ownership type of the team
          type: string
          enum:
            - enterprise
            - organization
        organization_id:
          type: integer
          description: Unique identifier of the organization to which this team belongs
        enterprise_id:
          type: integer
          description: Unique identifier of the enterprise to which this team belongs
      required:
        - id
        - node_id
        - url
        - members_url
        - name
        - description
        - permission
        - html_url
        - repositories_url
        - slug
        - type
    validation-error:
      title: Validation Error
      description: Validation Error
      type: object
      required:
        - message
        - documentation_url
      properties:
        message:
          type: string
        documentation_url:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
              - code
            properties:
              resource:
                type: string
              field:
                type: string
              message:
                type: string
              code:
                type: string
              index:
                type: integer
              value:
                oneOf:
                  - type:
                      - string
                      - 'null'
                  - type:
                      - integer
                      - 'null'
                  - type:
                      - array
                      - 'null'
                    items:
                      type: string
