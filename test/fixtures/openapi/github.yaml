            - string
            - 'null'
        location:
          type:
            - string
            - 'null'
        email:
          type:
            - string
            - 'null'
          format: email
        notification_email:
          type:
            - string
            - 'null'
          format: email
        hireable:
          type:
            - boolean
            - 'null'
        bio:
          type:
            - string
            - 'null'
        twitter_username:
          type:
            - string
            - 'null'
        public_repos:
          type: integer
        public_gists:
          type: integer
        followers:
          type: integer
        following:
          type: integer
        created_at:
          type: string
