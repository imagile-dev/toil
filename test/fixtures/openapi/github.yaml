openapi: 3.1.0
info:
  version: 1.1.4
  title: GitHub v3 REST API
  description: GitHub's v3 REST API.
  license:
    name: MIT
    url: https://spdx.org/licenses/MIT
  termsOfService: https://docs.github.com/articles/github-terms-of-service
  contact:
    name: Support
    url: https://support.github.com/contact?tags=dotcom-rest-api
servers:
  - url: https://api.github.com
paths:
  /repos/{owner}/{repo}/pulls:
    get:
      summary: List pull requests
      description: Lists pull requests in a specified repository.
      tags:
        - pulls
      operationId: pulls/list
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - name: state
          description: Either `open`, `closed`, or `all` to filter by state.
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
              - closed
              - all
            default: open
        - name: head
          description: >-
            Filter pulls by head user or head organization and branch name in the format of `user:ref-name` or
            `organization:ref-name`.
          in: query
          required: false
          schema:
            type: string
        - name: base
          description: Filter pulls by base branch name.
          in: query
          required: false
          schema:
            type: string
        - name: sort
          description: What to sort results by.
          in: query
          required: false
          schema:
            type: string
            enum:
              - created
              - updated
              - popularity
              - long-running
            default: created
        - name: direction
          description: The direction of the sort.
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
        - $ref: '#/components/parameters/per-page'
        - $ref: '#/components/parameters/page'
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/pull-request-simple'
          headers:
            Link:
              $ref: '#/components/headers/link'
        '304':
          $ref: '#/components/responses/not_modified'
        '422':
          $ref: '#/components/responses/validation_failed'
    post:
      summary: Create a pull request
      description: >-
        Draft pull requests are available in public repositories with GitHub Free and GitHub Free for organizations,
        GitHub Pro, and legacy per-repository billing plans, and in public and private repositories with GitHub Team and
        GitHub Enterprise 
      tags:
        - pulls
      operationId: pulls/create
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: The title of the new pull request.
                head:
                  type: string
                  description: The name of the branch where your changes are implemented.
                head_repo:
                  type: string
                  description: The name of the repository where the changes in the pull request were made.
                  format: repo.nwo
                base:
                  type: string
                  description: The name of the branch you want the changes pulled into.
                body:
                  type: string
                  description: The contents of the pull request.
                maintainer_can_modify:
                  type: boolean
                  description: >-
                    Indicates whether [maintainers can
                    modify](https://docs.github.com/articles/allowing-changes-to-a-pull-request-branch-created-from-a-fork/)
                    the pull request.
                draft:
                  type: boolean
                  description: Indicates whether the pull request is a draft.
                issue:
                  type: integer
                  format: int64
                  description: An issue in the repository to convert to a pull request.
              required:
                - head
                - base
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pull-request'
          headers:
            Location:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/forbidden'
        '422':
          $ref: '#/components/responses/validation_failed'
  /repos/{owner}/{repo}/pulls/{pull_number}:
    get:
      summary: Get a pull request
      description: >-
        Draft pull requests are available in public repositories with GitHub Free and GitHub Free for organizations,
        GitHub Pro, and legacy per-repository billing plans, and in public and private repositories with GitHub Team and
        GitHub Enterprise 
      tags:
        - pulls
      operationId: pulls/get
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/pull-number'
      responses:
        '200':
          description: >-
            Pass the appropriate [media
            type](https://docs.github.com/rest/using-the-rest-api/getting-started-with-the-rest-api#media-types) to
            fetch diff and patch formats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/pull-request'
        '304':
          $ref: '#/components/responses/not_modified'
        '404':
          $ref: '#/components/responses/not_found'
        '406':
          $ref: '#/components/responses/unacceptable'
        '422':
          $ref: '#/components/responses/validation_failed'
        '500':
          $ref: '#/components/responses/internal_error'
        '503':
          $ref: '#/components/responses/service_unavailable'
  /repos/{owner}/{repo}/issues/{issue_number}/comments:
    post:
      summary: Create an issue comment
      description: You can use the REST API to create comments on issues and pull requests.
      tags:
        - issues
      operationId: issues/create-comment
      parameters:
        - $ref: '#/components/parameters/owner'
        - $ref: '#/components/parameters/repo'
        - $ref: '#/components/parameters/issue-number'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body:
                  type: string
                  description: The contents of the comment.
              required:
                - body
      responses:
        '201':
          description: Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/issue-comment'
          headers:
            Location:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/forbidden'
        '404':
          $ref: '#/components/responses/not_found'
        '410':
          $ref: '#/components/responses/gone'
        '422':
          $ref: '#/components/responses/validation_failed'
  /user:
    get:
      summary: Get the authenticated user
      description: >-
        OAuth app tokens and personal access tokens (classic) need the `read:user` scope, or the broader `user` scope,
        for this endpoint to return the private user response.
      tags:
        - users
      operationId: users/get-authenticated
      parameters: []
      responses:
        '200':
          description: Response
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/private-user'
                  - $ref: '#/components/schemas/public-user'
                discriminator:
                  propertyName: user_view_type
                  mapping:
                    public: '#/components/schemas/public-user'
                    private: '#/components/schemas/private-user'
        '304':
          $ref: '#/components/responses/not_modified'
        '401':
          $ref: '#/components/responses/requires_authentication'
        '403':
          $ref: '#/components/responses/forbidden'
components:
  headers:
    link:
      schema:
        type: string
  parameters:
    issue-number:
      name: issue_number
      description: The number that identifies the issue.
      in: path
      required: true
      schema:
        type: integer
    owner:
      name: owner
      description: The account owner of the repository.
      in: path
      required: true
      schema:
        type: string
    page:
      name: page
      description: The page number of the results to fetch.
      in: query
      schema:
        type: integer
        default: 1
    per-page:
      name: per_page
      description: The number of results per page (max 100).
      in: query
      schema:
        type: integer
        default: 30
    pull-number:
      name: pull_number
      description: The number that identifies the pull request.
      in: path
      required: true
      schema:
        type: integer
    repo:
      name: repo
      description: The name of the repository without the `.git` extension.
      in: path
      required: true
      schema:
        type: string
  responses:
    forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
    gone:
      description: Gone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
    internal_error:
      description: Internal Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
    not_found:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
    not_modified:
      description: Not modified
    requires_authentication:
      description: Requires authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
    service_unavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
              message:
                type: string
              documentation_url:
                type: string
    unacceptable:
      description: Unacceptable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/basic-error'
    validation_failed:
      description: Validation failed, or the endpoint has been spammed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/validation-error'
  schemas:
    author-association:
      title: author_association
      type: string
      description: How the author is associated with the repository.
      enum:
        - COLLABORATOR
        - CONTRIBUTOR
        - FIRST_TIMER
        - FIRST_TIME_CONTRIBUTOR
        - MANNEQUIN
        - MEMBER
        - NONE
        - OWNER
    auto-merge:
      title: Auto merge
      description: The status of auto merging a pull request.
      type:
        - object
        - 'null'
      properties:
        enabled_by:
          $ref: '#/components/schemas/simple-user'
        merge_method:
          type: string
          description: The merge method to use.
          enum:
            - merge
            - squash
            - rebase
        commit_title:
          type: string
          description: Title for the merge commit message.
        commit_message:
          type: string
          description: Commit message for the merge commit.
      required:
        - enabled_by
        - merge_method
        - commit_title
        - commit_message
    basic-error:
      title: Basic Error
      description: Basic Error
      type: object
      properties:
        message:
          type: string
        documentation_url:
          type: string
        url:
          type: string
        status:
          type: string
    enterprise:
      title: Enterprise
      description: An enterprise on GitHub.
      type: object
      properties:
        description:
          description: A short description of the enterprise.
          type:
            - string
            - 'null'
        html_url:
          type: string
          format: uri
        website_url:
          description: The enterprise's website URL.
          type:
            - string
            - 'null'
          format: uri
        id:
          description: Unique identifier of the enterprise
          type: integer
        node_id:
          type: string
        name:
          description: The name of the enterprise.
          type: string
        slug:
          description: The slug url identifier for the enterprise.
          type: string
        created_at:
          type:
            - string
            - 'null'
          format: date-time
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
        avatar_url:
          type: string
          format: uri
      required:
        - id
        - node_id
        - name
        - slug
        - html_url
        - created_at
        - updated_at
        - avatar_url
    integration:
      title: GitHub app
      description: GitHub apps are a new way to extend GitHub.
      type:
        - object
        - 'null'
      properties:
        id:
          description: Unique identifier of the GitHub app
          type: integer
        slug:
          description: The slug name of the GitHub app
          type: string
        node_id:
          type: string
        client_id:
          type: string
        owner:
          oneOf:
            - $ref: '#/components/schemas/simple-user'
            - $ref: '#/components/schemas/enterprise'
        name:
          description: The name of the GitHub app
          type: string
        description:
          type:
            - string
            - 'null'
        external_url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        permissions:
          description: The set of permissions for the GitHub app
          type: object
          properties:
            issues:
              type: string
            checks:
              type: string
            metadata:
              type: string
            contents:
              type: string
            deployments:
              type: string
          additionalProperties:
            type: string
        events:
          description: The list of events for the GitHub app.
          type: array
          items:
            type: string
        installations_count:
          description: The number of installations associated with the GitHub app.
          type: integer
      required:
        - id
        - node_id
        - owner
        - name
        - description
        - external_url
        - html_url
        - created_at
        - updated_at
        - permissions
        - events
    issue-comment:
      title: Issue Comment
      description: Comments provide a way for people to collaborate on an issue.
      type: object
      properties:
        id:
          description: Unique identifier of the issue comment
          type: integer
          format: int64
        node_id:
          type: string
        url:
          description: URL for the issue comment
          type: string
          format: uri
        body:
          description: Contents of the issue comment
          type: string
        body_text:
          type: string
        body_html:
          type: string
        html_url:
          type: string
          format: uri
        user:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/simple-user'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        issue_url:
          type: string
          format: uri
        author_association:
          $ref: '#/components/schemas/author-association'
        performed_via_github_app:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/integration'
        reactions:
          $ref: '#/components/schemas/reaction-rollup'
        pin:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/pinned-issue-comment'
        minimized:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/issue-comment-minimized'
      required:
        - id
        - node_id
        - html_url
        - issue_url
        - user
        - url
        - created_at
        - updated_at
    issue-comment-minimized:
      title: Minimized Issue Comment
      description: Details about why an issue comment was minimized.
      type: object
      properties:
        reason:
          description: The reason the comment was minimized.
          type:
            - string
            - 'null'
      required:
        - reason
    license-simple:
      title: License Simple
      description: License Simple
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        url:
          type:
            - string
            - 'null'
          format: uri
        spdx_id:
          type:
            - string
            - 'null'
        node_id:
          type: string
        html_url:
          type: string
          format: uri
      required:
        - key
        - name
        - url
        - spdx_id
        - node_id
    link:
      title: Link
      description: Hypermedia Link
      type: object
      properties:
        href:
          type: string
      required:
        - href
    milestone:
      title: Milestone
      description: A collection of related issues and pull requests.
      type: object
      properties:
        url:
          type: string
          format: uri
        html_url:
          type: string
          format: uri
        labels_url:
          type: string
          format: uri
        id:
          type: integer
        node_id:
          type: string
        number:
          description: The number of the milestone.
          type: integer
        state:
          description: The state of the milestone.
          type: string
          enum:
            - open
            - closed
          default: open
        title:
          description: The title of the milestone.
          type: string
        description:
          type:
            - string
            - 'null'
        creator:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/simple-user'
        open_issues:
          type: integer
        closed_issues:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        closed_at:
          type:
            - string
            - 'null'
          format: date-time
        due_on:
          type:
            - string
            - 'null'
          format: date-time
      required:
        - closed_issues
        - creator
        - description
        - due_on
        - closed_at
        - id
        - node_id
        - labels_url
        - html_url
        - number
        - open_issues
        - state
        - title
        - url
        - created_at
        - updated_at
    pinned-issue-comment:
      title: Pinned Issue Comment
      description: Context around who pinned an issue comment and when it was pinned.
      type: object
      properties:
        pinned_at:
          type: string
          format: date-time
        pinned_by:
          anyOf:
            - type: 'null'
            - $ref: '#/components/schemas/simple-user'
      required:
        - pinned_at
        - pinned_by
    private-user:
      title: Private User
      description: Private User
      type: object
      properties:
        login:
          type: string
        id:
          type: integer
          format: int64
        user_view_type:
          type: string
        node_id:
          type: string
        avatar_url:
          type: string
          format: uri
        gravatar_id:
          type:
