# A local Impala for the db conformance suite's impala target (test/db/targets.ts),
# from the official apache/impala images: a Hive metastore, statestored, catalogd and
# one impalad that both coordinates and executes. Not in CI: it's four containers and
# a few gigabytes. The databases skill has the commands that start, use and remove it.
#
# The impalad's HiveServer2 port is on 51050 and its web UI, where the target counts
# running statements, on 55000. It runs with no authentication, so connections use
# "auth": "nosasl".
name: toil-test-impala

services:
  hms:
    image: apache/impala:4.5.3-impala_quickstart_hms
    command: ["hms"]
    volumes:
      - warehouse:/var/lib/hive
      - warehouse:/user/hive/warehouse
      - ./conf:/opt/hive/conf:ro
  statestored:
    image: apache/impala:4.5.3-statestored
    command: ["-redirect_stdout_stderr=false", "-logtostderr", "-v=1"]
    volumes:
      - ./conf:/opt/impala/conf:ro
  catalogd:
    image: apache/impala:4.5.3-catalogd
    depends_on: [statestored, hms]
    command: ["-redirect_stdout_stderr=false", "-logtostderr", "-v=1", "-hms_event_polling_interval_s=1", "-invalidate_tables_timeout_s=999999"]
    volumes:
      - warehouse:/user/hive/warehouse
      - ./conf:/opt/impala/conf:ro
  impalad:
    image: apache/impala:4.5.3-impalad_coord_exec
    depends_on: [statestored, catalogd]
    ports:
      - "127.0.0.1:51050:21050"
      - "127.0.0.1:55000:25000"
    command: ["-v=1", "-redirect_stdout_stderr=false", "-logtostderr", "-mt_dop_auto_fallback=true", "-default_query_options=mt_dop=4,default_file_format=parquet,default_transactional_type=insert_only", "-mem_limit=4gb"]
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx1g
    volumes:
      - warehouse:/user/hive/warehouse
      - ./conf:/opt/impala/conf:ro

volumes:
  warehouse:

# Java refuses a host name with an underscore, and Compose's default network name has one.
networks:
  default:
    name: toil-test-impala
