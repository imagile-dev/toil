name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # Windows, macOS and Linux are all first-class (principle 8), on the
        # supported floor and the current LTS. The floor is 22.16, the first
        # release with every node:sqlite API the db area uses; keep it in step
        # with "engines" in package.json.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22.16', 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Install scripts stay off even for the dev toolchain.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # No runtime deps, no install scripts, only Node built-ins, no spawning.
      - run: npm run check:pure
      # Install the packed tarball with scripts off; drive the CLI and MCP.
      - run: npm run smoke
