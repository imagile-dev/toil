name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        # Windows, macOS and Linux are all first-class (principle 8), on the
        # supported floor and the current Node release. The floor is 24.14, the
        # first release where both the OS certificate store and the proxy env
        # vars can be switched on from code (tls.setDefaultCACertificates,
        # http.setGlobalProxyFromEnv); keep it in step with "engines" in
        # package.json.
        #
        # A pull request runs every OS on the floor only; main and the release PR
        # add the current release. Seven PRs at once queued about 80 jobs against
        # the account's ~20-runner limit (5 on macOS) and held approved PRs for an
        # hour (#376). A Node 26 break still shows on main before any release.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ${{ fromJSON(github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') && '["24.14"]' || '["24.14", 26]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # A Windows runner's temp folder is on C:, its OS disk, where creating and
      # flushing a file is slow: a SQLite commit measured 22 to 117 ms there and
      # 0.7 ms on D:, the work disk RUNNER_TEMP is on (#328). Every test that
      # writes a temp folder paid that, and timed out at random. os.tmpdir()
      # reads TEMP and TMP on Windows; macOS and Linux keep their own.
      - name: Temp folder on the work disk
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      # Install scripts stay off even for the dev toolchain. ui/ is a workspace,
      # so this installs Toil UI's dev dependencies too, from the one lockfile.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # No runtime deps, no install scripts, only Node built-ins, no spawning.
      - run: npm run check:pure
      # On the release PR only, which rebuilds the committed dist/toil.js
      # (release.yml): it is exactly what the build just produced, on every OS.
      # Every other PR leaves dist/ alone (dist-guard below).
      - if: startsWith(github.head_ref, 'release-please--')
        run: npm run check:dist
      # Install the packed tarball with scripts off; drive the CLI and MCP.
      # Then clone the checkout and run the build from the clone, no install.
      - run: npm run smoke
      # Toil UI (ui/, @imagile-dev/toil-ui), the root's npm workspace: never in
      # toil's tarball, but held to the same gate on every OS. check:package is
      # its check:pure (one dependency, toil pinned exactly, no install scripts,
      # no native addon, the server imports only built-ins and toil, a tarball
      # allowlist); its smoke installs both tarballs offline, opens the UI, and
      # runs the layout check in the runner's Chrome (ui/scripts/layout-check.mjs).
      - run: npm run typecheck -w ui
      - run: npm run lint -w ui
      - run: npm test -w ui
      - run: npm run build -w ui
      - run: npm run check:package -w ui
      # The toil npm ci installed for Toil UI is the one ui/package.json pins
      # (#299). Not on the release PR: its pin is the toil that PR releases,
      # which npm can't serve before it merges; release.yml's lockfile job
      # points the lockfile at that toil once it is published.
      - if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        run: npm run check:lockfile -w ui
      - run: npm run smoke -w ui

  # The committed dist/toil.js is the last released toil, and only the release
  # PR rebuilds it, so any other PR that changes dist/ fails here. The head
  # branch name reaches the script through env, never the command line.
  dist-guard:
    name: dist/ left to the release PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: node scripts/check-dist.mjs --untouched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}

  # The skill installs through a real skill manager on every OS: Claude Code
  # validates the marketplace in the repository and installs the toil plugin
  # from it, with a throwaway config folder and no login. (The .agents/skills
  # path is a folder copy; test/skills.test.ts checks the folder stands alone.)
  # Optional rather than part of CI ok, because it downloads a third-party CLI.
  # A pull request installs on Linux only; main installs on every OS (#376).
  skill-install:
    name: skill install / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14'
      - name: Claude Code validates the marketplace and installs the skill from it
        shell: bash
        env:
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-config
          DISABLE_TELEMETRY: '1'
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          claude() { npx --yes @anthropic-ai/claude-code@2.1.289 "$@"; }
          claude plugin validate "$GITHUB_WORKSPACE"
          claude plugin marketplace add "$GITHUB_WORKSPACE"
          claude plugin install toil@toil
          claude plugin details toil@toil | tee "$RUNNER_TEMP/details.txt"
          grep -q 'Skills (1)' "$RUNNER_TEMP/details.txt"

  # The database providers against real engines (`npm run test:integration`,
  # the `databases` skill). Each server engine is a service container from its
  # official image at a pinned tag, and its URL env var is set, so a target
  # that can't reach its server fails here instead of skipping. Linux only:
  # service containers need a Linux runner, and the providers are plain
  # JavaScript, so the cross-platform gate above covers the rest.
  integration:
    name: Databases (integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # One provider (engine `mysql`) for both, so the suite runs against each.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: mysql
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      # A throwaway server for this job only; its SA password is a test value, in env, not argv.
      # SQLCMDPASSWORD is the same value for the health check's sqlcmd.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Toil-test-Pa55word
          SQLCMDPASSWORD: Toil-test-Pa55word
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 20s
      # Oracle Database Free. The faststart image ships an already-created
      # database, so it's healthy in about a minute instead of several.
      oracle:
        image: gvenzl/oracle-free:23.26.3-slim-faststart
        env:
          ORACLE_PASSWORD: toil_test_pw
        ports: ['1521:1521']
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    env:
      TOIL_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      TOIL_TEST_MYSQL_URL: mysql://root:mysql@localhost:3306/
      TOIL_TEST_MARIADB_URL: mysql://root:mysql@localhost:3307/
      TOIL_TEST_SQLSERVER_URL: mssql://sa:Toil-test-Pa55word@localhost:1433/master
      TOIL_TEST_ORACLE_URL: oracle://system:toil_test_pw@localhost:1521/FREEPDB1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:integration

  # The one check the ruleset on main requires, over the gate and the database
  # integration job, so a database regression blocks a merge. The gate's job
  # names include the Node version, so requiring them by name would silently stop
  # requiring them the day a version changes. always() matters: a skipped
  # required check counts as a pass, so this job must run, and fail, when either
  # of them fails.
  ci-ok:
    name: CI ok
    needs: [gate, integration, dist-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every gate job passed
        run: |
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "::error::The gate finished as '${{ needs.gate.result }}', not 'success'."
            exit 1
          fi
          echo "Every gate job passed."
      - name: The database integration job passed
        run: |
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "::error::The integration job finished as '${{ needs.integration.result }}', not 'success'."
            exit 1
          fi
          echo "The database integration job passed."
      # Skipped on a push to main, where there is no base to compare with.
      - name: The dist/ guard passed
        run: |
          if [ "${{ needs.dist-guard.result }}" != "success" ] && [ "${{ needs.dist-guard.result }}" != "skipped" ]; then
            echo "::error::The dist/ guard finished as '${{ needs.dist-guard.result }}'."
            exit 1
          fi
          echo "dist/ was left to the release PR."
