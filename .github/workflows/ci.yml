name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests and main run on Linux, on the supported Node floor, in two
  # jobs side by side: toil's gate and Toil UI's. Windows, macOS and Node 26 run
  # daily and on the release PR (platforms.yml), so a platform break shows within
  # a day and always before a release (#376). The floor is 24.14, the first
  # release where both the OS certificate store and the proxy env vars can be
  # switched on from code (tls.setDefaultCACertificates,
  # http.setGlobalProxyFromEnv); keep it in step with "engines" in package.json
  # and with platforms.yml.
  gate:
    name: toil gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14'
          cache: npm
      # Install scripts stay off even for the dev toolchain.
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # No runtime deps, no install scripts, only Node built-ins, no spawning.
      - run: npm run check:pure
      # On the release PR only, which rebuilds the committed dist/toil.js
      # (release.yml): it is exactly what the build just produced. platforms.yml
      # checks the same on every OS. Every other PR leaves dist/ alone (dist-guard).
      - if: startsWith(github.head_ref, 'release-please--')
        run: npm run check:dist
      # Install the packed tarball with scripts off; drive the CLI and MCP.
      # Then clone the checkout and run the build from the clone, no install.
      - run: npm run smoke

  # Toil UI (ui/, @imagile-dev/toil-ui), the root's npm workspace: never in
  # toil's tarball, but held to the same gate. check:package is its check:pure
  # (one dependency, toil pinned exactly, no install scripts, no native addon,
  # the server imports only built-ins and toil, a tarball allowlist); its smoke
  # installs both tarballs offline, opens the UI, and runs the layout check in
  # the runner's Chrome (ui/scripts/layout-check.mjs), one Chrome per core.
  ui:
    name: Toil UI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14'
          cache: npm
      - run: npm ci --ignore-scripts
      # The UI's smoke installs toil's packed tarball, so toil is built first.
      - run: npm run build
      - run: npm run typecheck -w ui
      - run: npm run lint -w ui
      - run: npm test -w ui
      - run: npm run build -w ui
      - run: npm run check:package -w ui
      # The toil npm ci installed for Toil UI is the one ui/package.json pins
      # (#299). Not on the release PR: its pin is the toil that PR releases,
      # which npm can't serve before it merges; release.yml's lockfile job
      # points the lockfile at that toil once it is published.
      - if: ${{ !startsWith(github.head_ref, 'release-please--') }}
        run: npm run check:lockfile -w ui
      - run: npm run smoke -w ui

  # The committed dist/toil.js is the last released toil, and only the release
  # PR rebuilds it, so any other PR that changes dist/ fails here. The head
  # branch name reaches the script through env, never the command line.
  dist-guard:
    name: dist/ left to the release PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: node scripts/check-dist.mjs --untouched
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}

  # The database providers against real engines (`npm run test:integration`,
  # the `databases` skill). Each server engine is a service container from its
  # official image at a pinned tag, and its URL env var is set, so a target
  # that can't reach its server fails here instead of skipping. Linux only:
  # service containers need a Linux runner, and the providers are plain
  # JavaScript, so the cross-platform gate above covers the rest.
  integration:
    name: Databases (integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # One provider (engine `mysql`) for both, so the suite runs against each.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: mysql
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
      # A throwaway server for this job only; its SA password is a test value, in env, not argv.
      # SQLCMDPASSWORD is the same value for the health check's sqlcmd.
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Toil-test-Pa55word
          SQLCMDPASSWORD: Toil-test-Pa55word
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -b -S localhost -U sa -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 20s
      # Oracle Database Free. The faststart image ships an already-created
      # database, so it's healthy in about a minute instead of several.
      oracle:
        image: gvenzl/oracle-free:23.26.3-slim-faststart
        env:
          ORACLE_PASSWORD: toil_test_pw
        ports: ['1521:1521']
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    env:
      TOIL_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      TOIL_TEST_MYSQL_URL: mysql://root:mysql@localhost:3306/
      TOIL_TEST_MARIADB_URL: mysql://root:mysql@localhost:3307/
      TOIL_TEST_SQLSERVER_URL: mssql://sa:Toil-test-Pa55word@localhost:1433/master
      TOIL_TEST_ORACLE_URL: oracle://system:toil_test_pw@localhost:1521/FREEPDB1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:integration

  # The one check the ruleset on main requires, over both gates and the database
  # integration job, so a database regression blocks a merge. Requiring one job
  # by name, rather than each gate, keeps the ruleset right when jobs change.
  # always() matters: a skipped required check counts as a pass, so this job
  # must run, and fail, when any of them fails.
  ci-ok:
    name: CI ok
    needs: [gate, ui, integration, dist-guard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: toil's gate passed
        run: |
          if [ "${{ needs.gate.result }}" != "success" ]; then
            echo "::error::The gate finished as '${{ needs.gate.result }}', not 'success'."
            exit 1
          fi
          echo "toil's gate passed."
      - name: Toil UI's gate passed
        run: |
          if [ "${{ needs.ui.result }}" != "success" ]; then
            echo "::error::Toil UI's gate finished as '${{ needs.ui.result }}', not 'success'."
            exit 1
          fi
          echo "Toil UI's gate passed."
      - name: The database integration job passed
        run: |
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "::error::The integration job finished as '${{ needs.integration.result }}', not 'success'."
            exit 1
          fi
          echo "The database integration job passed."
      # Skipped on a push to main, where there is no base to compare with.
      - name: The dist/ guard passed
        run: |
          if [ "${{ needs.dist-guard.result }}" != "success" ] && [ "${{ needs.dist-guard.result }}" != "skipped" ]; then
            echo "::error::The dist/ guard finished as '${{ needs.dist-guard.result }}'."
            exit 1
          fi
          echo "dist/ was left to the release PR."
