name: Release

# release-please turns Conventional Commits on main into a release PR. Merging
# that PR (a human merges it) creates the tag and GitHub release, and this
# workflow then publishes to npm and posts to Discord.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    # Off until every integration is built: no release PR, tag or npm publish.
    # A maintainer turns releases on by setting the repository variable
    # TOIL_RELEASES to "on" (CLAUDE.md, Delivery). publish-toil and publish-ui
    # need this job, so they're skipped too: the UI can't ship before toil does.
    if: vars.TOIL_RELEASES == 'on'
    runs-on: ubuntu-latest
    # The release PR is opened as the Imagile Bot App, not GITHUB_TOKEN. The
    # repo doesn't let Actions open PRs, and a PR opened with GITHUB_TOKEN
    # would trigger no workflows, so the release PR would get no CI. (The
    # agent review skips it: the App can't review its own PR, and the human
    # who merges it is the review.) This job's own token only needs to read.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      # Toil UI (ui/, @imagile-dev/toil-ui): release-please prefixes a package's
      # outputs with its path. Its tag is toil-ui-v<version>.
      ui_release_created: ${{ steps.rp.outputs['ui--release_created'] }}
      ui_tag_name: ${{ steps.rp.outputs['ui--tag_name'] }}
      ui_version: ${{ steps.rp.outputs['ui--version'] }}
    steps:
      - name: Generate Imagile Bot token
        id: imagile-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.IMAGILE_BOT_APP_ID }}
          private-key: ${{ secrets.IMAGILE_BOT_PRIVATE_KEY }}
          # release-please pushes its branch, opens the release PR, and on
          # merge tags and creates the GitHub release. Nothing else.
          permission-contents: write
          permission-pull-requests: write

      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.imagile-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # dist/toil.js (with dist/toil-lib.js) is committed so a clone of main runs the last released
      # toil, and only the release PR changes it: rebuild it on the release
      # PR's branch and commit it there, as the Imagile Bot App (the same token
      # release-please used, so CI runs on the push). CI's check:dist then
      # verifies it on that PR, on every OS. release-please rewrites its branch
      # on each run, so this runs whenever it opened or updated the PR.
      - name: Check out the release PR
        if: steps.rp.outputs.pr
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
          token: ${{ steps.imagile-token.outputs.token }}
      - if: steps.rp.outputs.pr
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14'
          cache: npm
      # dist/toil.js is the bin and dist/toil-lib.js the bundle it runs; both are
      # committed. Staged first, so a toil-lib.js that isn't tracked yet counts.
      - name: Rebuild dist/toil.js and dist/toil-lib.js and commit them to the release PR
        if: steps.rp.outputs.pr
        run: |
          npm ci --ignore-scripts
          npm run build
          git add dist/toil.js dist/toil-lib.js
          if git diff --cached --quiet -- dist/toil.js dist/toil-lib.js; then
            echo "dist/toil.js and dist/toil-lib.js already match the release's source."
            exit 0
          fi
          git config user.name "imagile-bot[bot]"
          git config user.email "imagile-bot[bot]@users.noreply.github.com"
          git commit -m "chore: rebuild dist/toil.js and dist/toil-lib.js for the release"
          git push

  publish-toil:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the tarball to the GitHub release
      id-token: write # npm provenance, and trusted publishing once it is set up
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14'
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later.
      - run: npm install -g npm@11.5.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run check:pure
      - run: npm run smoke

      # A token is only needed until trusted publishing is configured for the
      # package on npmjs.com; with it unset, npm publishes over OIDC. (The
      # `latest` move below still needs a token: see the note there.)
      # A prerelease goes out under its own dist-tag, the word after the hyphen:
      # 0.1.0-beta.1 under `beta` (the alphas before it went out under `alpha`).
      # Once a stable release exists, a plain `npm install @imagile-dev/toil`
      # never picks up a prerelease; before 1.0, `latest` follows the newest
      # beta (below), because there is nothing stable to install instead.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$VERSION" == *-* ]]; then DIST_TAG="${VERSION#*-}"; DIST_TAG="${DIST_TAG%%.*}"; else DIST_TAG=latest; fi
          echo "Publishing $VERSION under dist-tag $DIST_TAG"
          npm publish --access public --provenance --ignore-scripts --tag "$DIST_TAG"
          # Before 1.0 there is no stable release for `latest` to protect, and
          # npm may point `latest` at the first version ever published, which
          # would then go stale. So while `latest` is missing or itself a
          # prerelease, move it to the newest one. Once 1.0 ships and `latest`
          # is stable, prereleases only move their own tag.
          # `npm dist-tag` needs a token even when publishing uses OIDC, so it
          # warns rather than fails: by this line the release has already gone
          # out, and it mustn't be reported as a failed one. Before dropping
          # NPM_TOKEN for trusted publishing, move this step or remove it.
          if [[ "$DIST_TAG" != latest ]]; then
            # The package exists by now, so no `latest` shows as empty output
            # with exit 0; a non-zero exit only ever means the lookup failed,
            # and then `latest` is left alone rather than guessed at.
            if ! CURRENT_LATEST="$(npm view @imagile-dev/toil dist-tags.latest)"; then
              echo "::warning::Published $VERSION, but couldn't read the latest dist-tag, so left it alone."
              CURRENT_LATEST=unknown
            fi
            if [[ -z "$CURRENT_LATEST" || "$CURRENT_LATEST" == *-* ]]; then
              if npm dist-tag add "@imagile-dev/toil@$VERSION" latest; then
                echo "No stable release yet: latest now points at $VERSION"
              else
                echo "::warning::Published $VERSION, but couldn't move latest to it (npm dist-tag needs a token)."
              fi
            fi
          fi

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack --ignore-scripts
          gh release upload "$TAG" ./*.tgz --clobber

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && echo "DISCORD_WEBHOOK not set, skipping" && exit 0
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          NPM_URL="https://www.npmjs.com/package/@imagile-dev/toil/v/${VERSION}"
          jq -n \
            --arg title "@imagile-dev/toil v${VERSION} published" \
            --arg url "$RELEASE_URL" \
            --arg desc "[Release notes](${RELEASE_URL}) · [npm](${NPM_URL})" \
            --arg avatar "https://imagile-dev.github.io/toil/brand/toil-avatar-512.png" \
            --argjson color 16739901 \
            '{"username":"toil","avatar_url":$avatar,"embeds":[{"title":$title,"url":$url,"description":$desc,"color":$color}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @- \
          || echo "Discord notify failed (non-fatal)"

      # A silent publish failure is the one nobody notices. Shout about it.
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && echo "DISCORD_WEBHOOK not set, skipping" && exit 0
          jq -n \
            --arg title "@imagile-dev/toil v${VERSION} FAILED to publish" \
            --arg url "$RUN_URL" \
            --arg desc "The publish job failed. [View the run](${RUN_URL}). npm still serves the previous version." \
            --arg avatar "https://imagile-dev.github.io/toil/brand/toil-avatar-512.png" \
            --argjson color 15158332 \
            '{"username":"toil","avatar_url":$avatar,"embeds":[{"title":$title,"url":$url,"description":$desc,"color":$color}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @- \
          || echo "Discord notify failed (non-fatal)"

  # The lockfile after a release (#299). release-please's node-workspace plugin
  # moves Toil UI's pin on toil, and the version of package-lock.json's
  # node_modules/@imagile-dev/toil entry with it, but not the entry's resolved
  # URL or integrity: those still name the previous toil's tarball, so npm ci
  # installs that toil for Toil UI without a word. No tarball for the new
  # version exists until publish-toil has run, so the release PR can't carry
  # the fix. Once npm serves it, this rewrites that entry against npm, proves
  # it with npm ci and check:lockfile, and opens a PR with package-lock.json
  # alone, as the Imagile Bot App so CI runs on it. A human merges it; until
  # then check:lockfile fails other PRs with the fix spelled out.
  lockfile:
    needs: [release-please, publish-toil]
    if: needs.publish-toil.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate Imagile Bot token
        id: imagile-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.IMAGILE_BOT_APP_ID }}
          private-key: ${{ secrets.IMAGILE_BOT_PRIVATE_KEY }}
          # It pushes one branch and opens one PR. Nothing else.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          token: ${{ steps.imagile-token.outputs.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14'
          cache: npm
      # npm can take ten minutes or more to serve a toil publish-toil just sent,
      # as in publish-ui; the script waits up to 15 (#363).
      - name: Wait for npm to serve the toil Toil UI pins
        run: |
          PIN="$(node -p "require('./ui/package.json').dependencies['@imagile-dev/toil']")"
          echo "PIN=$PIN" >> "$GITHUB_ENV"
          if ! node scripts/wait-for-npm.mjs @imagile-dev/toil "$PIN"; then
            echo "::error::npm still doesn't serve @imagile-dev/toil $PIN after the wait above, so the lockfile can't point at it yet. Re-run this job once it does."
            exit 1
          fi
      # --prefer-online: setup-node restored ~/.npm, and its cached packument
      # may predate the publish.
      - name: Point the lockfile at it, and prove what npm ci installs
        run: |
          npm install --package-lock-only --prefer-online --ignore-scripts --no-audit --no-fund "@imagile-dev/toil@$PIN" -w ui --save-exact
          npm ci --ignore-scripts
          npm run check:lockfile -w ui
      - name: Open the lockfile PR
        env:
          GH_TOKEN: ${{ steps.imagile-token.outputs.token }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already installs @imagile-dev/toil $PIN for Toil UI."
            exit 0
          fi
          BRANCH="imagile-bot/lockfile-toil-$PIN"
          git config user.name "imagile-bot[bot]"
          git config user.email "imagile-bot[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add package-lock.json
          git commit -m "chore(deps): install toil $PIN for Toil UI" -m "The release moved Toil UI's pin to $PIN but left the lockfile entry on the previous toil's tarball (#299)."
          git push --force origin "$BRANCH"
          if [[ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]]; then
            echo "The lockfile PR for $PIN is already open; its branch is updated."
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "chore(deps): install toil $PIN for Toil UI" \
            --body "The release moved Toil UI's pin on toil to $PIN, but package-lock.json still pointed node_modules/@imagile-dev/toil at the previous toil's tarball, so npm ci installed that toil for Toil UI (#299). This points it at $PIN, which npm now serves; npm ci and npm run check:lockfile -w ui passed on it. CI's check:lockfile fails other PRs until this merges."

  # @imagile-dev/toil-ui, after toil. It pins toil exactly (the node-workspace
  # plugin rewrites the pin whenever toil releases), so the toil it names must
  # be on npm before it is. It runs when toil had nothing to release
  # (publish-toil skipped), and is skipped when toil's publish failed. Same npm
  # token, provenance, prerelease dist-tag logic and Discord notice as publish-toil.
  publish-ui:
    needs: [release-please, publish-toil]
    if: >-
      !cancelled() &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.ui_release_created == 'true' &&
      (needs.publish-toil.result == 'success' || needs.publish-toil.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the tarball to the GitHub release
      id-token: write # npm provenance, and trusted publishing once it is set up
    env:
      TAG: ${{ needs.release-please.outputs.ui_tag_name }}
      VERSION: ${{ needs.release-please.outputs.ui_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.ui_tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14'
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later.
      - run: npm install -g npm@11.5.1
      - run: npm ci --ignore-scripts
      # The pin is exact, so a toil npm doesn't serve would make a UI nobody
      # can install. Fail before publishing, not after. npm can take ten
      # minutes or more to serve a toil publish-toil just sent, so the script
      # asks with backoff for up to 15, logging each try (#363).
      - name: Check that npm serves the toil the UI pins
        run: |
          PIN="$(node -p "require('./ui/package.json').dependencies['@imagile-dev/toil']")"
          if ! node scripts/wait-for-npm.mjs @imagile-dev/toil "$PIN"; then
            echo "::error::@imagile-dev/toil-ui $VERSION pins @imagile-dev/toil $PIN, which npm still doesn't serve after the wait above. Re-run this job once it does."
            exit 1
          fi
      # The root build is toil's tarball, which the UI's smoke installs beside its own.
      - run: npm run build
      - run: npm test -w ui
      - run: npm run build -w ui
      - run: npm run check:package -w ui
      - run: npm run smoke -w ui

      # The same script as publish-toil's step of the same name, for the UI's
      # package (test/release-workflow.test.ts holds the two together).
      - name: Publish to npm
        working-directory: ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$VERSION" == *-* ]]; then DIST_TAG="${VERSION#*-}"; DIST_TAG="${DIST_TAG%%.*}"; else DIST_TAG=latest; fi
          echo "Publishing $VERSION under dist-tag $DIST_TAG"
          npm publish --access public --provenance --ignore-scripts --tag "$DIST_TAG"
          # Before 1.0 there is no stable release for `latest` to protect, and
          # npm may point `latest` at the first version ever published, which
          # would then go stale. So while `latest` is missing or itself a
          # prerelease, move it to the newest one. Once 1.0 ships and `latest`
          # is stable, prereleases only move their own tag.
          # `npm dist-tag` needs a token even when publishing uses OIDC, so it
          # warns rather than fails: by this line the release has already gone
          # out, and it mustn't be reported as a failed one. Before dropping
          # NPM_TOKEN for trusted publishing, move this step or remove it.
          if [[ "$DIST_TAG" != latest ]]; then
            # The package exists by now, so no `latest` shows as empty output
            # with exit 0; a non-zero exit only ever means the lookup failed,
            # and then `latest` is left alone rather than guessed at.
            if ! CURRENT_LATEST="$(npm view @imagile-dev/toil-ui dist-tags.latest)"; then
              echo "::warning::Published $VERSION, but couldn't read the latest dist-tag, so left it alone."
              CURRENT_LATEST=unknown
            fi
            if [[ -z "$CURRENT_LATEST" || "$CURRENT_LATEST" == *-* ]]; then
              if npm dist-tag add "@imagile-dev/toil-ui@$VERSION" latest; then
                echo "No stable release yet: latest now points at $VERSION"
              else
                echo "::warning::Published $VERSION, but couldn't move latest to it (npm dist-tag needs a token)."
              fi
            fi
          fi

      - name: Attach the tarball to the release
        working-directory: ui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack --ignore-scripts
          gh release upload "$TAG" ./*.tgz --clobber

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && echo "DISCORD_WEBHOOK not set, skipping" && exit 0
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          NPM_URL="https://www.npmjs.com/package/@imagile-dev/toil-ui/v/${VERSION}"
          jq -n \
            --arg title "@imagile-dev/toil-ui v${VERSION} published" \
            --arg url "$RELEASE_URL" \
            --arg desc "[Release notes](${RELEASE_URL}) · [npm](${NPM_URL})" \
            --arg avatar "https://imagile-dev.github.io/toil/brand/toil-avatar-512.png" \
            --argjson color 16739901 \
            '{"username":"toil","avatar_url":$avatar,"embeds":[{"title":$title,"url":$url,"description":$desc,"color":$color}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @- \
          || echo "Discord notify failed (non-fatal)"

      # A silent publish failure is the one nobody notices. Shout about it.
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && echo "DISCORD_WEBHOOK not set, skipping" && exit 0
          jq -n \
            --arg title "@imagile-dev/toil-ui v${VERSION} FAILED to publish" \
            --arg url "$RUN_URL" \
            --arg desc "The publish job failed. [View the run](${RUN_URL}). npm still serves the previous version." \
            --arg avatar "https://imagile-dev.github.io/toil/brand/toil-avatar-512.png" \
            --argjson color 15158332 \
            '{"username":"toil","avatar_url":$avatar,"embeds":[{"title":$title,"url":$url,"description":$desc,"color":$color}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @- \
          || echo "Discord notify failed (non-fatal)"
