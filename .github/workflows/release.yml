name: Release

# release-please turns Conventional Commits on main into a release PR. Merging
# that PR (a human merges it) creates the tag and GitHub release, and this
# workflow then publishes to npm and posts to Discord.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The release PR is opened as the Imagile Bot App, not GITHUB_TOKEN. The
    # repo doesn't let Actions open PRs, and a PR opened with GITHUB_TOKEN
    # would trigger no workflows, so the release PR would get no CI and no
    # review. This job's own token only needs to read.
    permissions:
      contents: read
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Generate Imagile Bot token
        id: imagile-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.IMAGILE_BOT_APP_ID }}
          private-key: ${{ secrets.IMAGILE_BOT_PRIVATE_KEY }}
          # release-please pushes its branch, opens the release PR, and on
          # merge tags and creates the GitHub release. Nothing else.
          permission-contents: write
          permission-pull-requests: write

      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.imagile-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the tarball to the GitHub release
      id-token: write # npm provenance, and trusted publishing once it is set up
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC, no token) needs npm 11.5.1 or later.
      - run: npm install -g npm@11.5.1
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run check:pure
      - run: npm run smoke

      # A token is only needed until trusted publishing is configured for the
      # package on npmjs.com; with it unset, npm publishes over OIDC.
      # A prerelease (0.1.0-alpha.1) goes out under the `alpha` dist-tag, so
      # `npm install @imagile-dev/toil` never picks one up by accident; only
      # `@alpha` or an exact version does. npm would otherwise tag it `latest`.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$VERSION" == *-* ]]; then DIST_TAG="${VERSION#*-}"; DIST_TAG="${DIST_TAG%%.*}"; else DIST_TAG=latest; fi
          echo "Publishing $VERSION under dist-tag $DIST_TAG"
          npm publish --access public --provenance --ignore-scripts --tag "$DIST_TAG"

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pack --ignore-scripts
          gh release upload "$TAG" ./*.tgz --clobber

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && echo "DISCORD_WEBHOOK not set, skipping" && exit 0
          RELEASE_URL="https://github.com/${REPO}/releases/tag/${TAG}"
          NPM_URL="https://www.npmjs.com/package/@imagile-dev/toil/v/${VERSION}"
          jq -n \
            --arg title "@imagile-dev/toil v${VERSION} published" \
            --arg url "$RELEASE_URL" \
            --arg desc "[Release notes](${RELEASE_URL}) · [npm](${NPM_URL})" \
            --arg avatar "https://imagile-dev.github.io/toil/brand/toil-avatar-512.png" \
            --argjson color 16739901 \
            '{"username":"toil","avatar_url":$avatar,"embeds":[{"title":$title,"url":$url,"description":$desc,"color":$color}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @- \
          || echo "Discord notify failed (non-fatal)"

      # A silent publish failure is the one nobody notices. Shout about it.
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && echo "DISCORD_WEBHOOK not set, skipping" && exit 0
          jq -n \
            --arg title "@imagile-dev/toil v${VERSION} FAILED to publish" \
            --arg url "$RUN_URL" \
            --arg desc "The publish job failed. [View the run](${RUN_URL}). npm still serves the previous version." \
            --arg avatar "https://imagile-dev.github.io/toil/brand/toil-avatar-512.png" \
            --argjson color 15158332 \
            '{"username":"toil","avatar_url":$avatar,"embeds":[{"title":$title,"url":$url,"description":$desc,"color":$color}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @- \
          || echo "Discord notify failed (non-fatal)"
