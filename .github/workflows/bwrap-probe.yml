name: bwrap probe (temporary)
on:
  pull_request:
    paths: ['.github/workflows/bwrap-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Before (expected to fail)
        run: |
          command -v bwrap || echo "no bwrap on the image"
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
      - name: Install bubblewrap for the agent's isolation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / true
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-user true
          echo "bubblewrap $(bwrap --version | cut -d' ' -f2) works."
      - name: Without the sysctl, for the record
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          bwrap --ro-bind / / true && echo "bwrap works even with the restriction" || echo "bwrap fails with the restriction"
