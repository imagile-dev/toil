name: Keychain live

# The unit suite stubs the credential store, so this is the only place
# toil's store code meets a real macOS Keychain and Linux Secret Service:
# login, resolve and remove one throwaway connection (test/live/).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/core/keychain.ts
      - src/core/connection.ts
      - src/connections/**
      - test/live/**
      - scripts/keychain-live.sh
      - vitest.live.config.ts
      - .github/workflows/keychain-live.yml

permissions:
  contents: read

concurrency:
  group: keychain-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsecret-tools gnome-keyring dbus
      - run: npm ci --ignore-scripts
      - run: bash scripts/keychain-live.sh
