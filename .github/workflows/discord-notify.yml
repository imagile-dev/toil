name: Discord Notifications

on:
  issues:
    types: [opened, closed]

# The webhook is the only credential this needs; the workflow token gets nothing.
permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          URL: ${{ github.event.issue.html_url }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          # Issues filed from outside (by the feedback backend) are posted by number
          # alone. Their titles are a reporter's own words, redacted by rules that can
          # only catch what they know, and the channel keeps whatever it is sent.
          FROM_OUTSIDE: ${{ contains(github.event.issue.labels.*.name, 'from-website') || contains(github.event.issue.labels.*.name, 'from-terminal') }}
        run: |
          [[ -z "$DISCORD_WEBHOOK" ]] && echo "DISCORD_WEBHOOK not set, skipping" && exit 0
          if [[ "$ACTION" == "opened" ]]; then
            VERB="Opened"
            COLOR=5793266
          elif [[ "$ACTION" == "closed" ]]; then
            VERB="Closed"
            COLOR=3066993
          else
            exit 0
          fi
          if [[ "$FROM_OUTSIDE" == "true" ]]; then
            HEADLINE="Issue #${NUMBER} ${ACTION}: filed from outside, title not shown"
          else
            HEADLINE="Issue #${NUMBER} ${ACTION}: ${TITLE}"
          fi
          jq -n \
            --arg title "$HEADLINE" \
            --arg url "$URL" \
            --arg desc "${VERB} by [@${ISSUE_USER}](https://github.com/${ISSUE_USER})" \
            --argjson color $COLOR \
            --arg avatar "https://imagile-dev.github.io/toil/brand/toil-avatar-512.png"             '{"username":"toil","avatar_url":$avatar,"embeds":[{"title":$title,"url":$url,"description":$desc,"color":$color}]}' \
          | curl -sf -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-
