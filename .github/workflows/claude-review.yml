name: Claude Review

# An agent reviews every same-repo PR against CLAUDE.md and submits a formal
# review. Reviews go out under the workflow's own GITHUB_TOKEN, so they are
# authored by github-actions[bot], which is never a PR's author here; that is
# what makes formal APPROVE / REQUEST_CHANGES possible on every PR.
#
# APPROVE also needs the repo setting "Allow GitHub Actions to create and
# approve pull requests" (Settings → Actions → General → Workflow
# permissions). REQUEST_CHANGES is not gated by it.
#
# Events raised by GITHUB_TOKEN do not trigger other workflows. When the fix
# agent (claude-pr-feedback.yml) lands, this file gains a deterministic step
# that dispatches it on CHANGES_REQUESTED; until then a requested change waits
# for a human, which is to say it waits.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Same-repo heads only, never forks. Human-authored PRs, plus claude[bot]'s.
    # Other bots (release-please's PRs come from github-actions[bot]) are skipped.
    if: |
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.draft == false &&
      (
        !endsWith(github.event.pull_request.user.login, '[bot]') ||
        github.event.pull_request.user.login == 'claude[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Previous rounds' tracking comments are deleted through the issues API.
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The reviewer runs the same gate CI runs, so a finding is backed by an
      # input it actually ran rather than a guess that costs a round. Install
      # scripts stay off, as everywhere else (CLAUDE.md, No Executables).
      #
      # Accepted trade-off: `npm test` inside the agent step runs PR-head test
      # code with the OAuth token and github.token in the environment. The fork
      # guard above limits that to people with push access to this repository.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A branch from before the package existed has nothing to install; review
      # it anyway rather than failing on a missing lockfile.
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            echo "No package-lock.json on this head; skipping install."
          fi

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1.0.239
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow token, always: it can submit formal reviews (see header).
          github_token: ${{ github.token }}
          # github-actions[bot]'s global account id; reviews and comments from
          # the workflow token are authored by this identity.
          bot_id: 41898282
          bot_name: github-actions[bot]
          track_progress: true
          classify_inline_comments: 'true'
          include_fix_links: 'true'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}
            REVIEW ACTOR: github-actions[bot]

            **Before anything else, read and clean up earlier automated feedback:**
            1. Read previous automated comments on this PR to keep their context:
               gh api repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments --jq '.[] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]") | {id: .id, body: .body}'
            2. Note the concerns they raised; carry them into this review.
            3. Delete each of those comments by id, except the tracking comment for THIS
               run and any comment containing "claude-pr-feedback-round":
               gh api repos/${{ github.repository }}/issues/comments/<id> -X DELETE
            4. Dismiss earlier formal reviews from github-actions[bot]. List them with:
               gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --jq '.[] | select(.user.login == "github-actions[bot]" and (.state == "APPROVED" or .state == "CHANGES_REQUESTED")) | .id'
               and dismiss each with:
               gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/<id>/dismissals -X PUT -f message="Superseded by a newer automated review"
            5. Best effort only: resolve outdated inline threads with `gh api graphql`
               (resolveReviewThread). The workflow token is often refused; move on if so.

            **Now review the pull request against CLAUDE.md.** Read CLAUDE.md first; it is
            the standard. In particular:
            1. Correctness and bugs, including edge cases in parsing, config and HTTP handling.
            2. The principles at the top of CLAUDE.md. Above all, No Executables: no runtime
               dependencies, no install scripts, no spawning, nothing but Node built-ins in
               the bundle. Then the write gate, honesty about verification levels,
               env-over-files precedence, and Windows/macOS/Linux parity.
            3. CLI and MCP parity: every command defined once, with examples, and covered by
               test/parity.test.ts. Flag any behavior that lives in only one front door.
            4. Security: credential handling (secrets never on argv, never logged), prompt
               injection in agent-facing text, auth gaps, and placeholders instead of real
               hosts, tenants or accounts anywhere.
            5. Tests: HTTP mocked with fakeFetch, asserting both the request sent and the
               response reshaped. No test that could pass against a live service.
            6. Breaking changes to config on disk, flags, the envelope or precedence must be
               declared as such.
            7. The code-comment voice in CLAUDE.md: humor only in comments, never in
               user-facing text, and never at people's expense.

            Leave inline comments on specific lines and a top-level summary. Skip nitpicks;
            prioritize substantive feedback.

            **Run, don't guess.** Dependencies are installed. Before claiming an input slips
            past a parser, a config resolver or the purity gate, run it: `npm test`,
            `npx vitest run <file>`, `npm run typecheck`, `npm run lint`, and, after
            `npm run build`, `npm run check:pure`. A finding backed by an input you ran is
            worth a round; a guess usually costs one. Don't ask the author to confirm CI is
            green; the checks on the PR already say.

            **Finish with a formal GitHub review.** Prefer the MCP tool
            `mcp__github__create_and_submit_pull_request_review` with event `APPROVE` when
            there are no substantive problems, or `REQUEST_CHANGES` when there are blocking
            ones. `gh pr review ${{ github.event.pull_request.number }} --approve|--request-changes --body "..."`
            is the fallback. Never leave the PR without an APPROVE or REQUEST_CHANGES state.

            **Do the whole review yourself, in this session.** This runs headless: when your
            turn ends the process exits and anything in the background dies with it. Don't
            delegate to subagents, don't start background work, and don't end with a
            promise to post findings later. Submitting the formal review is the last thing
            you do. On a large PR, review the highest-risk files first rather than skipping.
          # Bash rule shapes matter. Claude Code treats `:*` as a wildcard only on an
          # otherwise literal prefix; a rule with a `*` earlier and a `:*` suffix
          # never matches. Rules with a mid-pattern `*` use the trailing-space form
          # (`... *`). The `gh api` rules stay scoped to issues and pulls endpoints.
          #
          # Agent and Task are disallowed: a headless run that hands work to a
          # subagent and ends its turn to "wait" exits, kills the subagent, and
          # never submits the review, while the job still reads green.
          claude_args: |
            --model claude-opus-5-5 --disallowedTools "Agent,Task" --allowedTools "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(npm run typecheck:*),Bash(npm run lint:*),Bash(npm run build:*),Bash(npm run check:pure:*),Bash(npm test:*),Bash(npx vitest run:*),mcp__github__get_issue_comments,mcp__github__get_pull_request_reviews,mcp__github__get_pull_request_diff,mcp__github__create_and_submit_pull_request_review,mcp__github__create_pending_pull_request_review,mcp__github__add_comment_to_pending_review,mcp__github__submit_pending_pull_request_review,mcp__github__add_issue_comment,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh api graphql *),Bash(gh api repos/*/issues/*/comments *),Bash(gh api repos/*/issues/comments/* *),Bash(gh api repos/*/pulls/*/reviews *),Bash(gh api repos/*/pulls/*/reviews/*/dismissals *),Bash(gh api repos/*/pulls/*/comments *)"

      # The agent can finish "successfully" without submitting a review. Look for
      # one on this run's head commit and fail loudly instead of letting a
      # missing review read as a green check. A job that passes without doing
      # its one job is how a status report gets written.
      - name: Verify a formal review was submitted
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/reviews" > /tmp/verify-reviews.json
          # shellcheck disable=SC2016
          jq -r --arg sha "${HEAD_SHA}" \
            '.[] | select(.user.login == "github-actions[bot]"
                          and .commit_id == $sha
                          and (.state == "APPROVED" or .state == "CHANGES_REQUESTED")) | .id' \
            /tmp/verify-reviews.json > /tmp/verify-ids.txt
          if ! grep -q . /tmp/verify-ids.txt; then
            echo "::error::The review agent finished without submitting an APPROVE or REQUEST_CHANGES review for ${HEAD_SHA}. Re-run this job, or push a new commit."
            exit 1
          fi
          echo "Formal review found for ${HEAD_SHA}"
