name: Pages

on:
  push:
    branches: [main]
    # The site serves the Toil UI preview (ui/), built from the OWI types and fixture.
    paths: ['site/**', 'ui/**', 'package-lock.json', 'src/core/owi/**', 'test/fixtures/owi/**', '.github/workflows/pages.yml']
  pull_request:
    # The site serves the Toil UI preview (ui/), built from the OWI types and fixture.
    paths: ['site/**', 'ui/**', 'package-lock.json', 'src/core/owi/**', 'test/fixtures/owi/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # The site build builds the Toil UI preview into /ui/app/
      # (site/scripts/ui-preview.mjs). ui/ is the root's workspace, so its
      # dependencies come from the root's lockfile.
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
