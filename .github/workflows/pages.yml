name: Pages

on:
  push:
    branches: [main]
    # The site serves the Toil UI preview (ui/), built from the OWI types and fixture.
    paths: ['site/**', 'ui/**', 'package-lock.json', 'src/core/owi/**', 'test/fixtures/owi/**', '.github/workflows/pages.yml']
  pull_request:
    # The site serves the Toil UI preview (ui/), built from the OWI types and fixture.
    paths: ['site/**', 'ui/**', 'package-lock.json', 'src/core/owi/**', 'test/fixtures/owi/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # The site build builds the Toil UI preview into /ui/app/
      # (site/scripts/ui-preview.mjs). ui/ is the root's workspace, so its
      # dependencies come from the root's lockfile.
      - run: npm ci --ignore-scripts
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
