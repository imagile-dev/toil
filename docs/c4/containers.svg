<g id="web" class="c4-container"><rect x="338" y="300" width="230" height="102" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/><text x="453" y="329.6" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Web shop</text><text x="453" y="344.9" font-size="11" text-anchor="middle" fill="#ffffff">[Container: TypeScript, React]</text><text x="453" y="368.5" font-size="12" text-anchor="middle" fill="#ffffff">The storefront customers browse and</text><text x="453" y="384.5" font-size="12" text-anchor="middle" fill="#ffffff">buy from</text></g>
<g id="admin" class="c4-container"><rect x="618" y="300" width="230" height="102" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/><text x="733" y="329.6" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Back office</text><text x="733" y="344.9" font-size="11" text-anchor="middle" fill="#ffffff">[Container: TypeScript, React]</text><text x="733" y="368.5" font-size="12" text-anchor="middle" fill="#ffffff">Where staff edit the catalogue and</text><text x="733" y="384.5" font-size="12" text-anchor="middle" fill="#ffffff">review orders</text></g>
<g id="api" class="c4-container"><rect x="469.8" y="522" width="230" height="102" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/><text x="584.8" y="551.6" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Shop API</text><text x="584.8" y="566.9" font-size="11" text-anchor="middle" fill="#ffffff">[Container: Node.js, Fastify]</text><text x="584.8" y="590.5" font-size="12" text-anchor="middle" fill="#ffffff">Catalogue, basket and order logic</text><text x="584.8" y="606.5" font-size="12" text-anchor="middle" fill="#ffffff">over JSON/HTTPS</text></g>
<g id="worker" class="c4-container"><rect x="898" y="300" width="230" height="102" rx="10" fill="#438dd5" stroke="#3c7fc0" stroke-width="1.5"/><text x="1013" y="329.6" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Order worker</text><text x="1013" y="344.9" font-size="11" text-anchor="middle" fill="#ffffff">[Container: Node.js]</text><text x="1013" y="368.5" font-size="12" text-anchor="middle" fill="#ffffff">Sends confirmations and passes paid</text><text x="1013" y="384.5" font-size="12" text-anchor="middle" fill="#ffffff">orders to the warehouse</text></g>
