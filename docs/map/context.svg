<g id="services" class="c4-system"><rect x="67.5" y="812" width="230" height="170" rx="10" fill="#999999" stroke="#8a8a8a" stroke-width="1.5"/><text x="182.5" y="841.6" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Enterprise services and</text><text x="182.5" y="861.6" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">databases</text><text x="182.5" y="876.9" font-size="11" text-anchor="middle" fill="#ffffff">[Software System]</text><text x="182.5" y="900.5" font-size="12" text-anchor="middle" fill="#ffffff">(inferred) named by CLAUDE.md</text><text x="182.5" y="916.5" font-size="12" text-anchor="middle" fill="#ffffff">principle 9, not measured in code:</text><text x="182.5" y="932.5" font-size="12" text-anchor="middle" fill="#ffffff">Jira, GitHub, databases and the</text><text x="182.5" y="948.5" font-size="12" text-anchor="middle" fill="#ffffff">others toil talks to, at hosts in the user</text><text x="182.5" y="964.5" font-size="12" text-anchor="middle" fill="#ffffff">config</text></g>
