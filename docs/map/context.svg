<g id="engineer" class="c4-person"><rect x="129" y="50" width="230" height="118" rx="28" fill="#08427b" stroke="#073b6f" stroke-width="1.5"/><text x="244" y="79.6" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Engineer</text><text x="244" y="94.9" font-size="11" text-anchor="middle" fill="#ffffff">[Person]</text><text x="244" y="118.5" font-size="12" text-anchor="middle" fill="#ffffff">Installs toil from npm and runs it, or</text><text x="244" y="134.5" font-size="12" text-anchor="middle" fill="#ffffff">lets an agent drive it (CLAUDE.md</text><text x="244" y="150.5" font-size="12" text-anchor="middle" fill="#ffffff">Project)</text></g>
