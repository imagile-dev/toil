<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Circular cut of the toil mark for avatars (Discord, GitHub) that crop to a
       circle. Branches leave the rim radially, aimed at the centre, and bend
       into the orbit's junctions; the rim cuts them flush, so the avatar's own
       edge is what they converge from. Corners are transparent. -->
  <defs>
    <clipPath id="rim"><circle cx="32" cy="32" r="32"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="32" fill="#16130f"/>
  <g clip-path="url(#rim)" fill="none" stroke="#ff6a3d" stroke-width="3.2" stroke-linecap="round">
    <path d="M3.4 15.5C10.4 19.5 12 32 17.5 32M3.4 48.5C10.4 44.5 12 32 17.5 32M-1 32H17.5"/>
    <path d="M60.6 15.5C53.6 19.5 52 32 46.5 32M60.6 48.5C53.6 44.5 52 32 46.5 32M65 32H46.5"/>
    <circle cx="32" cy="32" r="14.5"/>
  </g>
  <circle cx="17.5" cy="32" r="4.2" fill="#ff6a3d" stroke="#16130f" stroke-width="2"/>
  <circle cx="46.5" cy="32" r="4.2" fill="#ff6a3d" stroke="#16130f" stroke-width="2"/>
  <circle cx="32" cy="17.5" r="3.7" fill="#34e2c4" stroke="#16130f" stroke-width="2"/>
  <circle cx="32" cy="46.5" r="3.7" fill="#f6f1e9" stroke="#16130f" stroke-width="2"/>
  <path d="M27.3 24.5h6.6l4.1 4.1v9.4a1.5 1.5 0 0 1-1.5 1.5H27.3a1.5 1.5 0 0 1-1.5-1.5V26a1.5 1.5 0 0 1 1.5-1.5Z" fill="#f6f1e9"/>
  <path d="M33.9 24.5v2.6a1.5 1.5 0 0 0 1.5 1.5H38Z" fill="#ff6a3d"/>
  <path d="m28.4 30.1 3 2.5-3 2.5" fill="none" stroke="#16130f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M32.7 36.4h3" stroke="#ff6a3d" stroke-width="2.2" stroke-linecap="round"/>
</svg>
