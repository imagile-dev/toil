<figure class="dx dx-src" data-reveal aria-labelledby="dx-src-cap">
<ol class="dx-src__places">
<li class="dx-place"><span class="dx-place__rank">Wins a name clash</span><span class="dx-place__k">Your own <code>user</code></span><code class="dx-place__v">~/.toil/dossiers/</code><span class="dx-place__w">Written by toil dossiers. Adopted: writes may follow it.</span></li>
<li class="dx-place"><span class="dx-place__rank">Second</span><span class="dx-place__k">Folders you list <code>listed</code></span><code class="dx-place__v">dossierPaths<br />TOIL_DOSSIER_PATHS</code><span class="dx-place__w">A team's repository of dossiers, cloned once.</span></li>
<li class="dx-place"><span class="dx-place__rank">Third</span><span class="dx-place__k">This repository <code>repo</code></span><code class="dx-place__v">.toil/dossiers/*.json</code><span class="dx-place__w">Checked in with the code. Applies while you're in that repository.</span></li>
</ol>
<div class="dx-src__pick">
<p class="dx-src__q">Which one applies to a call?</p>
<ol class="dx-src__rules">
<li><code>--dossier &lt;name|file&gt;</code> or <code>TOIL_DOSSIER</code>, when given. A file is the fourth source, <code>file</code>.</li>
<li>Otherwise the one whose repo matches the folder, by path, then by git remote.</li>
<li>Two different dossiers match: <code>INVALID_INPUT</code> until you pass <code>--dossier</code>. Never a guess.</li>
</ol>
</div>
<figcaption id="dx-src-cap">Where dossier files come from. When two places hold a dossier with the same name, your own wins, then a listed folder, then the repository.</figcaption>
</figure>
